schema_version: 1
analysis_id: cmt_stage_e_v1
paper_identity: target_specific_information_provenance_and_stage_dependent_learnability
purpose: secondary_estimator_sensitivity_before_analysis_freeze

inputs:
  master_feature_table: data/processed/notebook_02/02_master_feature_table.csv
  valid_record_universe: data/processed/notebook_05/05_valid_record_universe.csv
  protocol_feature_dir: data/processed/notebook_02/protocol_feature_lists
  stage_a_split_manifest: papers/cmt/results/stage_ab/stage_a_primary_split_manifest.csv
  stage_b_gate: papers/cmt/results/stage_ab/stage_b_gate.json
  stage_c_gate: papers/cmt/results/stage_c/stage_c_gate.json
  stage_c_earliest_useful_stage: papers/cmt/results/stage_c/stage_c_earliest_useful_stage.csv
  stage_d_gate: papers/cmt/results/stage_d/stage_d_gate.json

output_dir: papers/cmt/results/stage_e

targets:
  - average_voltage
  - capacity_grav
  - capacity_vol
  - energy_grav
  - energy_vol
  - max_delta_volume
  - stability_charge
  - stability_discharge
  - stability_worst

stages:
  - P1
  - P2
  - P3

primary_validation:
  reporting_name: framework-formula-grouped validation
  split_name: framework_groupkfold
  group_field: framework_uid
  n_folds: 5
  n_records: 3201
  n_framework_formula_groups: 1955

secondary_estimator:
  estimator: Ridge
  preprocessing:
    imputer: median
    standardize: true
  params:
    alpha: 1.0
  baseline:
    estimator: DummyRegressor
    strategy: mean

bootstrap:
  n_replicates: 5000
  confidence_level: 0.95
  interval_method: percentile
  random_seed: 20260907
  resampling_unit: framework_uid
  resample_within_fold: true
  paired_across_stages: true
  paired_across_targets: true

useful_learnability_rule:
  primary_threshold: 0.10
  point_requirement: both MAE and RMSE skills are at least 0.10
  interval_requirement: 95 percent bootstrap intervals for both skills are entirely above zero
  final_rule: point_requirement AND interval_requirement

incremental_information_value:
  transitions:
    - [P1, P2]
    - [P2, P3]
    - [P1, P3]

scope:
  primary_estimator_remains: fixed ExtraTrees from Stage B/C
  ridge_is_secondary_sensitivity_only: true
  run_domain_stress_tests_with_ridge: false
  run_random_validation: false
  run_hyperparameter_search: false
  note: Stage E is the final new model-fitting sensitivity before CMT analysis freeze.
